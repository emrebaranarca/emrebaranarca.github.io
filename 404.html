<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found · Emre Baran Arca</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f1ea">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d6451f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--surface:#faf8f1;--ink:#1b1916;--muted:#6f685b;--faint:#9c9484;--line:#ddd6c8;--accent:oklch(0.585 0.2 31);--serif:'Newsreader',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;}
@media (prefers-color-scheme: dark){:root{--bg:#141310;--surface:#1c1a15;--ink:#ece7dc;--muted:#9d9684;--faint:#6f695b;--line:#2c2922;--accent:oklch(0.72 0.18 47);}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
::selection{background:var(--accent);color:#fff}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card{max-width:640px;text-align:left}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;display:flex;align-items:center;gap:12px}
.eyebrow span.sq{width:10px;height:10px;background:var(--accent);display:inline-block}
h1{margin:0 0 24px;font-family:var(--serif);font-weight:500;font-size:clamp(72px,12vw,148px);line-height:.9;letter-spacing:-.025em}
h1 span{color:var(--accent)}
p{margin:0 0 32px;font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.4vw,28px);line-height:1.4;color:var(--muted);max-width:520px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--sans);font-weight:600;font-size:15px;padding:13px 22px;border-radius:9px;transition:background .2s,border-color .2s,color .2s}
a.primary{background:var(--ink);color:var(--bg)}
a.primary:hover{background:var(--accent)}
a.outline{color:var(--ink);border:1px solid var(--line)}
a.outline:hover{border-color:var(--accent)}
.arrow{font-family:var(--mono)}
footer{padding:22px 24px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="eyebrow"><span class="sq"></span> Error · 404 · Not found</div>
    <h1>404<span>.</span></h1>
    <p>This page doesn't exist — or it moved. Either way, it's not here. Let's get you back somewhere useful.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home <span class="arrow">→</span></a>
      <a class="btn outline" href="/tr.html">Türkçe versiyon</a>
    </div>
  </div>
</div>
<footer>
  <span>© Emre Baran Arca</span>
  <span>emrebaranarca.github.io</span>
</footer>
</body>
</html>
